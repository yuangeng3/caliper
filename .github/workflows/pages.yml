name: Deploy web demo to GitHub Pages

# Publishes the in-browser WASM demo (web/) to GitHub Pages. The demo is fully
# client-side: the only network calls are the page itself, the MediaPipe WASM
# runtime, and the Apache-2.0 model — no photo ever leaves the visitor's device.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
